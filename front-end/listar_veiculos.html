<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="theme.css">
    <title>Lista de Veículos</title>
</head>

<body>
    <div class="pagina">
        <div class="cabecalho-pagina">
            <a class="voltar" href="index.html">← Voltar ao painel</a>
            <h1>Frota</h1>
        </div>

        <div class="painel">
            <h2>Filtrar</h2>
            <div class="form-linha">
                <input type="text" id="input-modelo" placeholder="Modelo (Ex: Fiat Uno)">
                <select id="select-status">
                    <option value="disponível" selected>Disponível</option>
                    <option value="alugado">Alugado</option>
                    <option value="manutenção">Manutenção</option>
                </select>
                <button class="btn" onclick="filtrarVeiculos()">Filtrar</button>
            </div>
        </div>

        <div class="painel">
            <h2>Veículos</h2>
            <table id="tabela-frota">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Placa</th>
                        <th>Status</th>
                        <th>Km Atual</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-frota">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

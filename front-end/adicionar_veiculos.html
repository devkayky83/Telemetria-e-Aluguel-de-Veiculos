<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="theme.css">
    <title>Cadastrar Veículo — AlphaCars</title>
</head>
<body>
    <div class="pagina">
        <div class="cabecalho-pagina">
            <a class="voltar" href="index.html">← Voltar ao painel</a>
            <h1>Cadastrar Veículo</h1>
        </div>

        <div class="painel">
            <h2>Novo veículo</h2>
            <div class="form-linha">
                <input type="text" id="input-modelo" placeholder="Modelo (Ex: Fiat Uno)">
                <input type="text" id="input-placa" placeholder="Placa (Ex: ABC-1234)">
                <button class="btn" onclick="cadastrarVeiculo()">Cadastrar</button>
            </div>
        </div>

        <div class="painel">
            <h2>Veículos cadastrados</h2>
            <table id="tabela-cadastro">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Placa</th>
                        <th>Status</th>
                        <th>KM Atual</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-cadastro">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

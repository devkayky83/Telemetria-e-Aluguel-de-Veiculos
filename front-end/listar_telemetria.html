<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Telemetria — AlphaCars</title>
</head>

<body>
    <div class="pagina">
        <div class="cabecalho-pagina">
            <a class="voltar" href="index.html">← Voltar ao painel</a>
            <h1>Telemetria</h1>
        </div>

        <div class="painel">
            <h2>Buscar por veículo</h2>
            <div class="form-linha">
                <input type="text" id="input-veiculo" placeholder="Modelo (Ex: Fiat Uno)">
                <button class="btn btn-secundario" onclick="carregarTelemetria()">Buscar</button>
            </div>
        </div>

        <div class="painel">
            <h2>Leituras registradas</h2>
            <table id="tabela-telemetria">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Veículo</th>
                        <th>Latitude</th>
                        <th>Longitude</th>
                        <th>Quilometragem</th>
                        <th>Registrado em</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-telemetria">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Devolver Veículo Alugado</title>
</head>

<body>
    <h1>Modelo desejado:</h1>
    <section>
        <input type="text" id="input-modelo" placeholder="Modelo (Ex: Fiat Uno)">
        <button onclick="filtrarVeiculosAlugados()">Buscar</button>
    </section>

    <section>
        <h2>Veículos Alugados</h2>
        <table id="tabela-veiculos-alugados">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Modelo</th>
                    <th>Placa</th>
                    <th>Status</th>
                    <th>KM Atual</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-alugados">
            </tbody>
        </table>
</body>

<script src="script.js"></script>
</html>

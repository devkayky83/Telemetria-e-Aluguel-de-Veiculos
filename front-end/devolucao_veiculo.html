<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="theme.css">
    <title>Devolver Veículo — AlphaCars</title>
</head>

<body>
    <div class="pagina">
        <div class="cabecalho-pagina">
            <a class="voltar" href="index.html">← Voltar ao painel</a>
            <h1>Devolver Veículo</h1>
        </div>

        <div class="painel">
            <h2>Buscar por modelo</h2>
            <div class="form-linha">
                <input type="text" id="input-modelo" placeholder="Modelo (Ex: Fiat Uno)">
                <button class="btn btn-secundario" onclick="filtrarVeiculosAlugados()">Buscar</button>
            </div>
        </div>

        <div class="painel">
            <h2>Veículos alugados</h2>
            <table id="tabela-veiculos-alugados">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Placa</th>
                        <th>Status</th>
                        <th>KM Atual</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-alugados">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
